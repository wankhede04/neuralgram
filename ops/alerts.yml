# Prometheus alert rules for Neuralgram (C8, M5-4).
# Thresholds mirror src/neuralgram/observability/alerts.py — keep in sync.
groups:
  - name: neuralgram
    rules:
      - alert: NeuralgramJobFailures
        expr: sum(increase(neuralgram_jobs_failed_total[15m])) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Jobs exhausted retries and were marked failed"

      - alert: NeuralgramQueueBacklogHigh
        expr: neuralgram_queue_depth{status="queued"} > 100
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Durable queue backlog above 100 jobs for 10 minutes"

      - alert: NeuralgramHttpLatencyHigh
        expr: >
          sum(rate(neuralgram_http_request_duration_seconds_sum[5m]))
          / sum(rate(neuralgram_http_request_duration_seconds_count[5m])) > 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Mean HTTP latency above 1s"

      - alert: NeuralgramTenantSpendSpike
        expr: sum by (tenant) (increase(neuralgram_model_cost_usd_total[1h])) > 10
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Tenant spent more than $10 in the last hour"
