[project]
name = "neuralgram"
version = "0.1.0"
description = "Context engine: multi-source ingest, durable memory, pre-model compression, model routing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20",
    "pgvector>=0.3",
    "regex>=2024.5",
    "redis>=5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "testcontainers[postgres]>=4.7",
    "hypothesis>=6.100",
    "types-regex>=2026.6.28.20260630",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralgram"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# pgvector ships no py.typed marker
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["neuralgram"]
branch = true

[tool.coverage.report]
show_missing = true
