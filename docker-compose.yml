services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOCK_PROVIDERS: "true"
      DATABASE_URL: postgresql+asyncpg://neuralgram:neuralgram@postgres:5432/neuralgram # pragma: allowlist secret
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neuralgram
      # dev-only credential; deployed envs use a secret manager
      POSTGRES_PASSWORD: neuralgram # pragma: allowlist secret
      POSTGRES_DB: neuralgram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralgram"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
